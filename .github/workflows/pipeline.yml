name: Trusted Container Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: trusted-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Policy and provenance tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/policy-demo.py
      - run: for script in scripts/*.sh; do bash -n "$script"; done

  build:
    name: Build and sign release evidence
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/pipeline.yml@refs/heads/main
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare image name
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p evidence
          echo "IMAGE=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "TAG=run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          printf '%s\n' "$GITHUB_SHA" > evidence/source-commit.txt
      - name: Install checksum-pinned tools
        run: bash scripts/install-tools.sh 2>&1 | tee evidence/tool-versions.log
      - name: Log in to GHCR with temporary package-write token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build, scan and sign image, SBOM, provenance and decision
        run: bash scripts/build-release.sh 2>&1 | tee evidence/build.log
      - name: Publish handoff data for separate deployment workflow
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-handoff
          path: evidence/release.json
          overwrite: true
          retention-days: 14
          if-no-files-found: error
      - name: Build summary
        if: always()
        run: |
          {
            echo '## Build and signed evidence'
            cat evidence/scenarios.txt 2>/dev/null || true
            echo 'Deployment and Kubernetes admission are verified by the separate Deploy Verified Release workflow.'
            echo '```json'
            cat evidence/build-decision.json 2>/dev/null || echo '{"decision":"NOT_REACHED"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: build-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 14
      - name: Log out
        if: always()
        run: docker logout ghcr.io
